name: Derleme ve testler

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Testler
        run: dotnet test tests/Evrakci.Tests --configuration Release
      - name: Uygulamayı derle
        run: dotnet build src/Evrakci.App --configuration Release
